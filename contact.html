<style type="text/css" data-portfolio-css="true"></style><style>
#__portfolio-editorbar-container {
    align-items: center;
    display: flex;
    gap: 8px;
    position: fixed;
    z-index: calc(2147483647);
    width: max-content;
    cursor: pointer;
}

#__portfolio-editorbar-label {
    background-color: #111;
    border-radius: 8px;
    font-family: var(--portfolio-fresco-sansSerif-font-family, "Inter Variable UI", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif, emoji, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol");
    font-size: var(--portfolio-fresco-base-font-size, 12px);
    height: fit-content;
    opacity:1;
    padding: 4px 8px;
    transition: opacity 0.4s ease-out;
    font-weight: var(--portfolio-fresco-base-font-weight, 450);
    flex-shrink: 0;
    position: fixed;
    width: max-content;
    pointer-events: none;
    user-select: none;
}

#__portfolio-editorbar-button {
    all: unset;
    align-items: center;
    border-radius: 15px;
    display: flex;
    height: 30px;
    justify-content: center;
    width: 30px;
    flex-shrink: 0;
}

.__portfolio-editorbar-spinner {
    display: block;
    width: 16px;
    height: 16px;
    transform-origin: 50% 50%;
    will-change: transform;
    animation: __portfolio-editorbar-spinner-spin 600ms linear infinite;
}

.__portfolio-editorbar-spinner svg {
    display: block;
    overflow: visible;
}

.__portfolio-editorbar-spinner-track, .__portfolio-editorbar-spinner-car {
    fill: none;
    stroke: currentColor;
    stroke-width: 2px;
}

.__portfolio-editorbar-spinner-track {
    opacity: 0.25;
}

.__portfolio-editorbar-spinner-car {
    stroke-linecap: round;
    stroke-dasharray: 30 70;
}

@keyframes __portfolio-editorbar-spinner-spin {
    to {
        transform: rotate(360deg);
    }
}

#__portfolio-editorbar-label.__portfolio-editorbar-button-tooltip-visible {
    opacity: 1;
}

#__portfolio-editorbar-label, #__portfolio-editorbar-button {
    backdrop-filter: blur(10px);
    background-color: rgba(34, 34, 34, 0.8);
    box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 4px 0px, rgba(0, 0, 0, 0.05) 0px 1px 0px 0px, rgba(255, 255, 255, 0.15) 0px 0px 0px 1px;
    color: #fff;
}
</style><style>
#__portfolio-editorbar {
    /* https://sergeyski.com/css-color-scheme-and-iframes-lessons-learned-from-disqus-background-bug */
    color-scheme: light dark;
    overflow: hidden;
    position: fixed;
    border: none;
    z-index: calc(2147483647);
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    touch-action: manipulation;
}

@supports (height: 100dvh) {
    #__portfolio-editorbar {
        height: 100dvh;
    }
}

#__portfolio-editorbar.status_hidden {
    display: none;
}

#__portfolio-editorbar.status_visually_hidden {
    clip-path: circle(1px at calc(100% - 1px) calc(100% - 1px));
    z-index: calc(2147483647 - 1);
}

#__portfolio-editorbar.status_measuring {
    clip-path: unset;
}
